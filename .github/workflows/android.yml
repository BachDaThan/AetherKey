name: Build AetherKey APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Cách ổn định hơn: dùng v4 + chỉ cài package cần thiết
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "No gradlew found yet (skeleton). Skipping build."
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "✅ Workflow OK - project is still skeleton (chưa có Gradle Wrapper)."
            echo "Khi có gradlew + source đầy đủ thì sẽ build APK thật."
            exit 0
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        with:
          name: AetherKey-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
